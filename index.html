
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro de coordenadores 2027 da Associação Amazonas Roraima">
  <title>Cadastro para Coordenadores 2027</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <h1>ASSOCIAÇÃO AMAZONAS RORAIMA</h1>
      <div class="linha"></div>
      <h2>CADASTRO PARA COORDENADORES 2027</h2>
    </header>

    <form id="formCadastro">
      <p class="aviso">Os campos marcados com * são obrigatórios.</p>

      <section>
        <h3>1. Dados do cadastro</h3>

        <label for="departamento">Departamento *</label>
        <select id="departamento" name="departamento" required>
          <option value="">Selecione o departamento</option>
          <option value="AVENTUREIROS">AVENTUREIROS</option>
          <option value="DESBRAVADORES">DESBRAVADORES</option>
          <option value="JOVENS">JOVENS</option>
        </select>

        <label for="distrito">Distrito *</label>
       <select
  id="distrito"
  name="distrito"
  required
>
  <option value="">Selecione o distrito</option>
  <option>13 DE SETEMBRO</option>
  <option>ALTO ALEGRE</option>
  <option>ARAÚJO COSTA</option>
  <option>ASA BRANCA</option>
  <option>BARCELOS</option>
  <option>BARREIRINHA</option>
  <option>BARREIRINHA II</option>
  <option>BEIJA FLOR</option>
  <option>BELA VISTA</option>
  <option>BOA VISTA - CENTRAL</option>
  <option>BOA VISTA DO RAMOS</option>
  <option>BONFIM</option>
  <option>CAMPOS ELISEOS</option>
  <option>CARACARAÍ</option>
  <option>CARANÃ</option>
  <option>CAROEBE</option>
  <option>CAÇARI</option>
  <option>CENTRAL - AAMAR</option>
  <option>IAAI - RIO PRETO DA EVA</option>
  <option>ITACOATIARA</option>
  <option>ITAPIRANGA</option>
  <option>LIBERDADE</option>
  <option>MONTE DAS OLIVEIRAS</option>
  <option>MONTE SINAI</option>
  <option>MUCAJAI</option>
  <option>NOVA CANAÃ</option>
  <option>NOVA CIDADE</option>
  <option>NOVA COLINA</option>
  <option>OSVALDO FROTA</option>
  <option>PACARAIMA</option>
  <option>PALMARES</option>
  <option>PARINTINS CENTRAL</option>
  <option>PARQUE 10</option>
  <option>PARQUE SOLIMÕES</option>
  <option>PARQUE SÃO PEDRO</option>
  <option>PRESIDENTE FIGUEIREDO I</option>
  <option>PRESIDENTE FIGUEIREDO II</option>
  <option>REDENÇÃO I</option>
  <option>REDENÇÃO II</option>
  <option>RIO PRETO DA EVA</option>
  <option>RORAINÓPOLIS</option>
  <option>SANTA ETELVINA</option>
  <option>SANTA TEREZA</option>
  <option>SILVIO BOTELHO</option>
  <option>TANCREDO NEVES</option>
  <option>URUCARÁ</option>
</select>

        <label for="cargo">Cargo *</label>
        <select id="cargo" name="cargo" required>
          <option value="">Selecione o cargo</option>
          <option value="REGIONAL">REGIONAL</option>
          <option value="DISTRITAL">DISTRITAL</option>
          <option value="COORDENADOR">COORDENADOR</option>
        </select>

        <div id="grupoRegiao" class="oculto">
          <label for="regiao">Região *</label>
          <select id="regiao" name="regiao" disabled>
            <option value="">Selecione a região</option>
            <option value="1ª REGIÃO">1ª REGIÃO</option>
            <option value="2ª REGIÃO">2ª REGIÃO</option>
            <option value="3ª REGIÃO">3ª REGIÃO</option>
            <option value="4ª REGIÃO">4ª REGIÃO</option>
            <option value="5ª REGIÃO">5ª REGIÃO</option>
            <option value="6ª REGIÃO">6ª REGIÃO</option>
            <option value="7ª REGIÃO">7ª REGIÃO</option>
            <option value="8ª REGIÃO">8ª REGIÃO</option>
            <option value="9ª REGIÃO">9ª REGIÃO</option>
            <option value="10ª REGIÃO">10ª REGIÃO</option>
            <option value="11ª REGIÃO">11ª REGIÃO</option>
            <option value="12ª REGIÃO">12ª REGIÃO</option>
            <option value="13ª REGIÃO">13ª REGIÃO</option>
            <option value="14ª REGIÃO">14ª REGIÃO</option>
            <option value="15ª REGIÃO">15ª REGIÃO</option>
            <option value="16ª REGIÃO">16ª REGIÃO</option>
            <option value="17ª REGIÃO">17ª REGIÃO</option>
            <option value="18ª REGIÃO">18ª REGIÃO</option>
            <option value="19ª REGIÃO">19ª REGIÃO</option>
            <option value="20ª REGIÃO">20ª REGIÃO</option>
            <option value="21ª REGIÃO">21ª REGIÃO</option>
            <option value="22ª REGIÃO">22ª REGIÃO</option>
            <option value="23ª REGIÃO">23ª REGIÃO</option>
            <option value="24ª REGIÃO">24ª REGIÃO</option>
            <option value="25ª REGIÃO">25ª REGIÃO</option>
          </select>
        </div>
      </section>

      <section>
        <h3>2. Identificação pessoal</h3>

        <label for="nome">Nome completo *</label>
        <input
          id="nome"
          name="nome_completo"
          type="text"
          autocomplete="name"
          minlength="3"
          maxlength="160"
          placeholder="Digite seu nome completo"
          required
        >

        <label for="cpf">CPF *</label>
        <input
          id="cpf"
          name="cpf"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="14"
          placeholder="000.000.000-00"
          aria-describedby="erroCpf"
          required
        >
        <small id="erroCpf" class="erro"></small>

        <label for="email">E-mail *</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          placeholder="seuemail@exemplo.com"
          aria-describedby="erroEmail"
          required
        >
        <small id="erroEmail" class="erro"></small>
      </section>

      <section>
        <h3>3. Documento obrigatório</h3>

        <label for="carta">Carta de recomendação *</label>
        <input
          id="carta"
          name="carta_recomendacao"
          type="file"
          accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
          required
        >
        <small>Formatos aceitos: PDF, JPG e PNG. Tamanho máximo: 5 MB.</small>
      </section>

      <section class="consentimento">
        <label class="checkbox-label" for="consentimento">
                <input
                    id="consentimento"
                    name="consentimento"
                    type="checkbox"
                    required
                >
                <span>
                    Declaro que as informações fornecidas são verdadeiras e estou
                    ciente de que meus dados serão utilizados para o processo de
                    cadastro de coordenadores 2027.
                </span>
                </label>
            </section>

            <button type="submit" id="btnEnviar">
                Validar cadastro
            </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>

    <footer>
      Associação Amazonas Roraima · Cadastro 2027
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
